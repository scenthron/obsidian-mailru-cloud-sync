name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest version agrees with git tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Error: Git tag ($TAG) does not match manifest.json version ($VERSION)"
            exit 1
          fi

      - name: Package plugin zip archive
        run: |
          mkdir -p mailru-cloud-sync
          cp main.js manifest.json styles.css mailru-cloud-sync/
          zip -r mailru-cloud-sync.zip mailru-cloud-sync/

      - name: Create GitHub Release and attach assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
            mailru-cloud-sync.zip
          generate_release_notes: true
